# Gradle
org.gradle.jvmargs=-Xmx2G
org.gradle.parallel=true

# ВНИМАНИЕ: подставь актуальные версии под реальную сборку Fabric для 1.21.11.
# Где смотреть:
#   minecraft / yarn      -> https://fabricmc.net/develop/  (выбрать 1.21.11)
#   loader / fabric-api   -> там же
# Значения ниже — ориентир и почти наверняка потребуют правки под существующие сборки.
minecraft_version=1.21.11
yarn_mappings=1.21.11+build.1
loader_version=0.16.14

# Fabric API
fabric_version=0.141.4+1.21.11

# Mod Properties
mod_version=1.0.0
maven_group=studio.altdev.staffmode
archives_base_name=altstaffmod
